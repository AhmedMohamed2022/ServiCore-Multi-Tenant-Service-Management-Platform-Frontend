<sc-page-header title="Agent performance"
    description="Ticket load and resolutions per agent, ranked by tickets resolved."
    [breadcrumbs]="[{ label: 'Reports' }, { label: 'Agents' }]">
    <sc-report-range slot="actions" variant="segmented" (rangeChange)="onRangeChange($event)" />
</sc-page-header>

<div [attr.aria-busy]="isLoading()">
    @if (isLoading() && !hasRows()) {
    <sc-report-skeleton label="Loading agent statistics" />
    } @else if (errorMessage() && !hasRows()) {
    <!-- Nothing to show yet and the request failed: say so, and offer a retry. -->
    <div class="sc-card">
        <sc-empty-state icon="cloud_off" tone="error" title="Couldn't load this report" [description]="errorMessage()!"
            actionLabel="Try again" (action)="fetchData()" />
    </div>
    } @else if (!hasRows()) {
    <div class="sc-card">
        <sc-empty-state icon="support_agent" title="No agent activity in this period"
            description="Widen the date range, or check that agents have been assigned tickets." />
    </div>
    } @else {

    @if (errorMessage()) {
    <!-- A refresh failed: keep the last good data on screen and flag it. -->
    <sc-alert tone="error" title="Couldn't refresh this report" class="mb-4 block">{{ errorMessage() }}</sc-alert>
    }

    <div class="transition-opacity duration-sc ease-sc" [class.opacity-60]="isLoading()">
        <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
            <sc-stat-card label="Agents" [value]="rows().length" icon="support_agent" tone="info" />
            <sc-stat-card label="Assigned" [value]="totals().total" icon="assignment" tone="neutral" />
            <sc-stat-card label="Active now" [value]="totals().active" icon="pending_actions" tone="info"
                hint="Open, in progress, or waiting" />
            <sc-stat-card label="Resolution rate" [value]="resolutionRate() + '%'" icon="task_alt" tone="success"
                hint="Resolved or closed" />
        </div>

        <sc-entity-breakdown [rows]="entityRows()" noun="agent" nounPlural="agents" nameHeading="Agent"
            defaultSort="resolved" [showAvatar]="true" />
    </div>
    }
</div>

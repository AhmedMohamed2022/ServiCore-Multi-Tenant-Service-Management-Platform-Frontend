<sc-page-header title="Category breakdown" description="What kind of work is coming in, and how much of it is finished."
    [breadcrumbs]="[{ label: 'Reports' }, { label: 'Categories' }]">
    <sc-report-range slot="actions" variant="segmented" (rangeChange)="onRangeChange($event)" />
</sc-page-header>

<div [attr.aria-busy]="isLoading()">
    @if (isLoading() && !hasRows()) {
    <sc-report-skeleton label="Loading category statistics" />
    } @else if (errorMessage() && !hasRows()) {
    <!-- Nothing to show yet and the request failed: say so, and offer a retry. -->
    <div class="sc-card">
        <sc-empty-state icon="cloud_off" tone="error" title="Couldn't load this report" [description]="errorMessage()!"
            actionLabel="Try again" (action)="fetchData()" />
    </div>
    } @else if (!hasRows()) {
    <div class="sc-card">
        <sc-empty-state icon="sell" title="No category activity in this period"
            description="Widen the date range, or check that tickets have been categorised." />
    </div>
    } @else {

    @if (errorMessage()) {
    <!-- A refresh failed: keep the last good data on screen and flag it. -->
    <sc-alert tone="error" title="Couldn't refresh this report" class="mb-4 block">{{ errorMessage() }}</sc-alert>
    }

    <div class="transition-opacity duration-sc ease-sc" [class.opacity-60]="isLoading()">
        <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
            <sc-stat-card label="Categories" [value]="rows().length" icon="sell" tone="info" />
            <sc-stat-card label="Total tickets" [value]="totals().total" icon="confirmation_number" tone="neutral" />
            <sc-stat-card label="Active now" [value]="totals().active" icon="pending_actions" tone="info"
                hint="Open, in progress, or waiting" />
            <sc-stat-card label="Completion rate" [value]="completionRate() + '%'" icon="task_alt" tone="success"
                hint="Resolved or closed" />
        </div>

        <sc-entity-breakdown [rows]="entityRows()" noun="category" nounPlural="categories" nameHeading="Category" />
    </div>
    }
</div>

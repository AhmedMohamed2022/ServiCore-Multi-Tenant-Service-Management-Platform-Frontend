<sc-auth-layout heading="Activate your portal account"
    subheading="Set a password to track your support tickets and reply to your service team.">

    <div class="sc-card p-6">

        @if (successMessage()) {
        <sc-alert tone="success" title="You're all set" class="mb-5 block">{{ successMessage() }}</sc-alert>
        }

        @if (errorMessage()) {
        <sc-alert tone="error" title="Invitation problem" class="mb-5 block">{{ errorMessage() }}</sc-alert>
        }

        @if (!token) {
        <p class="text-[13px] leading-relaxed text-ink-muted">
            Open the link exactly as it appears in your invitation email — the token it carries is what identifies
            your invitation.
        </p>
        } @else if (!successMessage()) {
        <form [formGroup]="setupForm" (ngSubmit)="onCompleteCustomerOnboarding()" class="flex flex-col gap-4">
            <sc-password-field [control]="setupForm.controls.password" inputId="customerPassword"
                label="Choose a password" placeholder="At least six characters" autocomplete="new-password"
                [showStrength]="true" />

            <button type="submit" class="sc-btn sc-btn-primary w-full"
                [disabled]="setupForm.invalid || isProcessing()">
                @if (isProcessing()) {
                <sc-icon name="progress_activity" size="sm" class="sc-spin" />
                Activating your account
                } @else {
                Activate my account
                <sc-icon name="arrow_forward" size="sm" />
                }
            </button>
        </form>
        }
    </div>

    <p class="mt-6 text-center text-[13px] text-ink-muted">
        Already activated?
        <a routerLink="/login" class="font-semibold text-brand-700 hover:underline">Sign in</a>
    </p>
</sc-auth-layout>
